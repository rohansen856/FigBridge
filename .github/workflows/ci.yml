name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The pnpm version comes from packageManager in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Extension-host tests
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a ' || '' }}pnpm --filter figbridge exec sh -c "tsc -p tsconfig.test.json && vscode-test"
        shell: bash
      - name: Package VSIX
        if: matrix.os == 'ubuntu-latest'
        run: pnpm --filter figbridge package
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: figbridge-vsix
          path: packages/vscode-extension/figbridge.vsix
